name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alerta_test
          POSTGRES_USER: alerta_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alerta_test -d alerta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
        env:
          # Disposable CI service only; never points at the deployed database.
          TEST_DATABASE_URL: ${{ matrix.backend == 'postgresql' && 'postgresql://alerta_test:local_test_only@127.0.0.1:5432/alerta_test' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.backend }}
          path: test-results.xml
